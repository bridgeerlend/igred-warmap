<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IGRED · Institute for Geopolitical Risk and Economic Development</title>
<meta name="description" content="An independent analysis body monitoring geopolitical risk and economic development worldwide, with sourced, verifiable analysis.">
<meta name="color-scheme" content="light dark">
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="atlas.css">
<link rel="stylesheet" href="home.css">
</head>
<body>

<a class="skip" href="#now">Skip to the content</a>

<header class="top">
  <a class="top-mark" href="./"><strong>IGRED</strong> <span data-i18n="wordmarkFull"></span></a>
  <nav class="top-nav" aria-label="Products">
    <a href="https://map.igred.org/" data-i18n="navMap"></a>
    <a href="https://map.igred.org/brief/" data-i18n="navBrief"></a>
  </nav>
  <div class="top-tools">
    <button type="button" class="pill" id="lang">NO</button>
    <button type="button" class="pill" id="theme">Dark</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-text">
      <h1 class="hero-title" data-i18n="heroTitle"></h1>
      <p class="hero-lede" data-i18n="heroStandfirst"></p>
      <div class="hero-actions">
        <a class="btn btn-solid" href="https://map.igred.org/" data-i18n="ctaMap"></a>
        <a class="btn" href="https://map.igred.org/brief/" data-i18n="ctaBrief"></a>
      </div>
    </div>

    <figure class="live">
      <a class="live-map" id="live-map" href="https://map.igred.org/" aria-describedby="live-caption">
        <svg id="live-svg" viewBox="0 0 1000 520" role="img" aria-labelledby="live-caption"></svg>
      </a>
      <figcaption class="live-caption" id="live-caption"></figcaption>
    </figure>
  </section>

  <section class="band" id="now" aria-labelledby="now-heading">
    <div class="band-head">
      <h2 class="band-title" id="now-heading" data-i18n="nowHeading"></h2>
      <a class="band-link" href="https://map.igred.org/" data-i18n="nowAll"></a>
    </div>
    <ol class="cards" id="cards" aria-busy="true"></ol>
  </section>

  <section class="band" id="publish" aria-labelledby="publish-heading">
    <div class="band-head">
      <h2 class="band-title" id="publish-heading" data-i18n="productsHeading"></h2>
    </div>
    <ul class="products">
      <li>
        <a class="product" href="https://map.igred.org/">
          <span class="product-name" data-i18n="mapName"></span>
          <span class="product-kind" data-i18n="kindLive"></span>
          <span class="product-body" data-i18n="mapBody"></span>
        </a>
      </li>
      <li>
        <a class="product" href="https://map.igred.org/brief/">
          <span class="product-name" data-i18n="briefName"></span>
          <span class="product-kind" data-i18n="kindDaily"></span>
          <span class="product-body" data-i18n="briefBody"></span>
        </a>
      </li>
      <li>
        <div class="product is-coming">
          <span class="product-name" data-i18n="reportsName"></span>
          <span class="product-kind" data-i18n="kindTwiceYearly"></span>
          <span class="product-body" data-i18n="reportsBody"></span>
        </div>
      </li>
      <li>
        <div class="product is-coming">
          <span class="product-name" data-i18n="baseName"></span>
          <span class="product-kind" data-i18n="kindOngoing"></span>
          <span class="product-body" data-i18n="baseBody"></span>
        </div>
      </li>
    </ul>
  </section>

  <section class="band about" aria-labelledby="about-heading">
    <div class="band-head">
      <h2 class="band-title" id="about-heading" data-i18n="whatHeading"></h2>
    </div>
    <div class="about-body">
      <p class="about-lede" data-i18n="whatBody1"></p>
      <p data-i18n="whatBody2"></p>
      <ul class="people">
        <li><span class="person-name">Erlend B. Moe</span> <span class="person-role" data-i18n="role"></span></li>
        <li><span class="person-name">Viktor T. Bratberg</span> <span class="person-role" data-i18n="role"></span></li>
      </ul>
    </div>
  </section>
</main>

<footer class="foot">
  <p data-i18n="wordmarkFull"></p>
  <p><a href="mailto:contact@igred.org">contact@igred.org</a></p>
</footer>

<script type="module" src="home.js"></script>
</body>
</html>
