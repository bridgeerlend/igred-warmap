# The fixed risk register. Every half-year report scores the same list, so a score can be
# compared with the edition before it. Add a risk at the end; never rename or reuse an id,
# because the arrows in the register follow the id from one edition to the next.
risks:
  - id: russia-nato
    nb: Direkte konfrontasjon mellom Russland og NATO
    en: Direct confrontation between Russia and NATO
  - id: ukraine-front
    nb: Sammenbrudd av frontlinjen i Ukraina
    en: Collapse of the front line in Ukraine
  - id: iran-israel
    nb: Åpen krig mellom Iran og Israel
    en: Open war between Iran and Israel
  - id: red-sea
    nb: Langvarig stengning av skipsfarten i Rødehavet
    en: Prolonged closure of Red Sea shipping
  - id: hormuz
    nb: Forstyrrelse av oljeeksporten gjennom Hormuzstredet
    en: Disruption of oil exports through the Strait of Hormuz
  - id: taiwan
    nb: Blokade eller militær krise rundt Taiwan
    en: Blockade or military crisis around Taiwan
  - id: sahel-spread
    nb: Spredning av opprøret i Sahel til kyststatene
    en: Spread of the Sahel insurgency to the coastal states
  - id: sudan-famine
    nb: Hungersnød i flere regioner i Sudan
    en: Famine in several regions of Sudan
  - id: drc-regional
    nb: Regional krig i Øst-Kongo
    en: Regional war in eastern DR Congo
  - id: india-pakistan
    nb: Militær opptrapping mellom India og Pakistan
    en: Military escalation between India and Pakistan
