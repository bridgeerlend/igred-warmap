<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<title>Varde Brief</title>
<meta name="description" content="A dated daily briefing on geopolitical risk. Every story carries the outlets that reported it, with links.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B0B0A">
<script>try{if(localStorage.getItem('igred-theme-v2')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="preload" href="../fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../atlas.css">
<link rel="stylesheet" href="brief.css">
</head>
<body>

<a class="skip" href="#edition">Skip to the briefing</a>

<div class="banner" id="banner" hidden></div>

<header class="masthead brief-masthead is-sticky">
  <a class="wordmark wordmark-link brand" href="https://igred.org/" aria-label="Varde Research"><svg class="brand-mark" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><path d="M100.00 14.00L100.00 14.00A86 86 0 0 1 162.02 40.42L37.98 40.42A86 86 0 0 1 100.00 14.00Z" fill="#E4542A"/><path d="M24.94 47.42L161.06 47.42A86 86 0 0 1 177.71 85.17L8.29 85.17A86 86 0 0 1 24.94 47.42Z" fill="currentColor"/><path d="M22.36 92.17L193.64 92.17A86 86 0 0 1 187.12 133.70L28.88 133.70A86 86 0 0 1 22.36 92.17Z" fill="currentColor"/><path d="M20.24 140.70L171.76 140.70A86 86 0 0 1 96.00 186.00L96.00 186.00A86 86 0 0 1 20.24 140.70Z" fill="currentColor"/></svg><strong>Varde Research</strong> <span>Brief</span></a>
  <div class="controls">
    <a class="link-button" href="../">Map</a>
    <a class="link-button" href="../stream/">Wire</a>
    <button type="button" class="link-button" id="lang" aria-label="Bytt til norsk">NO</button>
    <button type="button" class="link-button" id="theme">Light</button>
  </div>
</header>

<main class="edition" id="edition">
  <div class="dateline">
    <h1 class="title" id="edition-date"></h1>
    <p class="standfirst" id="standfirst"></p>
    <nav class="edition-nav" id="edition-nav" aria-label="Editions"></nav>
  </div>

  <div class="column">
    <div class="browse">
      <div class="browse-row">
        <label class="search">
          <span class="sr-only" data-i18n="searchLabel">Search the edition</span>
          <input type="search" id="search" autocomplete="off" spellcheck="false">
        </label>
        <div class="sort" role="group" aria-label="Order">
          <button type="button" class="opt is-on" data-sort="coverage" data-i18n="sortCoverage"></button>
          <button type="button" class="opt" data-sort="newest" data-i18n="sortNewest"></button>
        </div>
      </div>

      <nav class="themes" id="themes" aria-label="Themes"></nav>
      <p class="browse-status" id="browse-status"></p>
    </div>

    <div id="sections"></div>
  </div>
</main>

<aside class="archive" aria-labelledby="archive-heading">
  <h2 id="archive-heading" data-i18n="archive">Earlier editions</h2>
  <div class="archive-list" id="archive-list"></div>
</aside>

<footer class="colophon">
  <p class="cite" id="cite"></p>
  <p id="colophon-text"></p>
  <p class="colophon-meta meta" id="colophon-meta"></p>
  <p class="meta"><a href="mailto:contact@igred.org">contact@igred.org</a></p>
</footer>

<script type="module" src="brief.js"></script>
</body>
</html>
