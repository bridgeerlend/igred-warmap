<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IGRED Global Conflict Monitor</title>
<meta name="description" content="An automated global conflict map. Every incident carries its source, its date and a link to the original.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#index">Skip to the list of places</a>

<!-- Above the stage, not below it: a message about missing or stale data is useless
     if it sits under the fold. -->
<div class="banner" id="banner" hidden></div>

<div class="stage">
  <div class="rail">
    <header class="masthead">
      <p class="wordmark">IGRED <span>Global Conflict Monitor</span></p>
      <div class="controls">
        <button type="button" class="link-button" id="lang" aria-label="Bytt til norsk">NO</button>
        <button type="button" class="link-button" id="theme">Dark</button>
      </div>
    </header>

    <h1 class="title">
      <span data-i18n="titleLine1">The world,</span>
      <span class="italic" data-i18n="titleLine2">at war</span>
    </h1>

    <p class="standfirst" id="standfirst"></p>

    <nav class="window" aria-label="Time window">
      <button type="button" class="window-option" data-days="1" data-i18n="win1">24 hours</button>
      <button type="button" class="window-option" data-days="7" data-i18n="win7">7 days</button>
      <button type="button" class="window-option is-on" data-days="30" data-i18n="win30">30 days</button>
    </nav>
  </div>

  <div class="plate" id="plate">
    <svg id="map" role="img" aria-describedby="standfirst"></svg>

    <div class="plate-tools">
      <button type="button" class="link-button" id="zoom-out" aria-label="Zoom out">&minus;</button>
      <button type="button" class="link-button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" class="link-button" id="zoom-reset" data-i18n="reset">Reset</button>
    </div>

    <p class="scale-key" id="scale-key"></p>
  </div>

  <!-- After the plate in source order: on a phone or tablet the detail belongs below the
       map you just tapped. On desktop the grid lifts it into the foot of the label. -->
  <section class="detail" id="detail" aria-live="polite"></section>
</div>

<nav class="index" id="index" aria-labelledby="index-heading">
  <h2 id="index-heading" data-i18n="whereToday">Where, today</h2>
  <div class="index-grid" id="index-grid"></div>
</nav>

<footer class="colophon">
  <p id="colophon-text"></p>
  <p class="colophon-meta" id="colophon-meta"></p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
