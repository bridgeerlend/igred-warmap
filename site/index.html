<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>Global Conflict Monitor · IGRED</title>
<meta name="description" content="A live map of armed conflict. Every incident carries its source, its date and a link to the original.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B0B0A">
<meta property="og:title" content="Global Conflict Monitor · IGRED">
<meta property="og:description" content="A live map of armed conflict. Every incident carries its source, its date and a link to the original.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://map.igred.org/">
<script>try{if(localStorage.getItem('igred-theme-v2')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="atlas.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="mapapp">
<a class="skip" href="#crisis-list">Skip to the list of crises</a>

<!-- Above everything: a note about stale data is useless below the fold. -->
<div class="banner" id="banner" hidden></div>

<div class="app" id="app">
  <header class="masthead app-masthead is-sticky">
    <a class="wordmark wordmark-link" href="https://igred.org/"><strong>IGRED</strong></a>
    <nav class="controls">
      <a class="link-button" href="brief/" data-i18n="brief">Brief</a>
      <a class="link-button" href="stream/" data-i18n="wire">Wire</a>
      <button type="button" class="link-button" id="lang">NO</button>
      <button type="button" class="link-button" id="theme">Light</button>
    </nav>
  </header>
  <aside class="rail" id="rail">

    <div class="overview" id="overview">
      <h1 class="title">
        <span data-i18n="titleLine1">Global Conflict</span>
        <span class="italic" data-i18n="titleLine2">Monitor</span>
      </h1>
      <p class="standfirst" id="standfirst"></p>

      <div class="search">
        <label class="sr-only" for="search" data-i18n="search">Search</label>
        <input type="search" id="search" autocomplete="off" spellcheck="false">
        <div class="results" id="results" role="listbox" hidden></div>
      </div>

      <nav class="window" id="window" aria-label="Time window">
        <button type="button" class="link-button quiet" data-w="1"></button>
        <button type="button" class="link-button quiet" data-w="7"></button>
        <button type="button" class="link-button quiet" data-w="30"></button>
      </nav>

      <p class="meta list-note" id="list-note"></p>
      <ol class="crisis-list" id="crisis-list"></ol>
    </div>

    <!-- A crisis or a country takes the column's place; the map stays where it is. -->
    <section class="detail" id="detail" hidden aria-live="polite"></section>
  </aside>

  <main class="plate" id="plate">
    <div class="map" id="map" role="region" aria-label="Map"></div>

    <!-- The filter: incident types, and the layer of trade and energy routes beneath it. -->
    <div class="mapfilter" id="mapfilter">
      <button type="button" class="link-button mapfilter-toggle" id="mapfilter-toggle" aria-expanded="true" aria-controls="mapfilter-body">Filter</button>
      <div class="mapfilter-body" id="mapfilter-body">
        <ul class="mapfilter-types" id="mapfilter-types"></ul>
        <div class="mapfilter-layers" id="mapfilter-layers"></div>
      </div>
    </div>

    <div class="legend meta" id="legend"></div>
    <div class="zoom">
      <button type="button" class="link-button" id="zoom-out" aria-label="Zoom out">&minus;</button>
      <button type="button" class="link-button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" class="link-button" id="zoom-reset" data-i18n="reset">Reset</button>
    </div>

    <div class="timeline" id="timeline">
      <button type="button" class="link-button" id="play">Play</button>
      <output class="timeline-date" id="asof-date" for="asof"></output>
      <div class="timeline-track">
        <div class="timeline-bars" id="timeline-bars" aria-hidden="true"></div>
        <input type="range" id="asof" min="0" max="29" step="1" value="29" aria-label="Date">
      </div>
      <button type="button" class="link-button" id="now">Now</button>
    </div>
  </main>
</div>

<!-- One line: when the data was updated, and the sources folded away until asked for. -->
<footer class="colophon colophon-folded" id="colophon">
  <p class="meta"><span id="updated"></span></p>
  <p class="meta"><button type="button" class="link-button quiet" id="sources-toggle" aria-expanded="false" aria-controls="colophon-sources">Sources</button></p>
  <p class="meta"><a href="mailto:contact@igred.org">contact@igred.org</a></p>
  <p class="colophon-method" id="colophon-sources" hidden><span id="method"></span> <span id="ranking"></span></p>
</footer>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
