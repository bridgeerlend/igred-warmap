# igred.org — the institute page, served from www/.
#
# The map and the Brief are deployed separately to map.igred.org by GitHub Pages; a
# repository can only have one Pages site, and that one is spoken for.

[build]
  publish = "www"
  # www/ is plain HTML, CSS and ES modules. The one build step is the reports: Markdown from
  # the editor in www/content/reports/ becomes www/reports/ and a PDF of each report, printed
  # by Playwright from the same page. Nothing else is generated.
  command = "npx playwright install chromium --only-shell && npx tsx scripts/build-reports.ts --pdf"

  # Netlify builds on every push by default, and the pipeline commits data every hour. The
  # script skips those, and skips every draft branch the editor makes (cms/...), every deploy
  # preview and every branch deploy: only a change to what igred.org is made from, on main,
  # builds. Exit 0 means "skip this build".
  ignore = "sh scripts/netlify-ignore.sh"

# Drafts are branches with pull requests (Decap's editorial workflow). They are never built:
# the ignore script skips them, and these contexts are told the same in case it is bypassed.
[context.deploy-preview]
  command = "echo 'deploy previews are off' && exit 0"
  ignore = "exit 0"

[context.branch-deploy]
  command = "echo 'branch deploys are off' && exit 0"
  ignore = "exit 0"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    # Font filenames carry a content hash from Google's CDN, so they can be cached hard.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    # Netlify does not know the extension; browsers want the manifest type to install the icon.
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/admin/*"
  [headers.values]
    # The editor is not for search engines.
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/reports/*.pdf"
  [headers.values]
    Content-Disposition = "attachment"
