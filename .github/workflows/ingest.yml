name: Ingest

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

# Data updates must never trigger a site rebuild, so this workflow only writes to data/.
permissions:
  contents: write
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch, validate and write data
        env:
          UCDP_ACCESS_TOKEN: ${{ secrets.UCDP_ACCESS_TOKEN }}
        run: npm run ingest

      - name: Commit data if it changed
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "igred-bot"
          git config user.email "map@igred.org"
          git add data
          git commit -m "data: ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # A candidate is only ever a request for a decision. Opening the pull request is the
      # whole point of detection — without it the finding sits in a JSON file nobody reads.
      - name: Propose a new conflict for review
        id: propose
        continue-on-error: true
        run: |
          npm run propose-conflict -- --pr-body /tmp/conflict-pr.md | tee /tmp/propose.log
          grep -oE '(PROPOSED|CANDIDATE_ID|COUNTRY)=[^ ]*' /tmp/propose.log >> "$GITHUB_OUTPUT" || true

      - name: Open the confirmation pull request
        if: steps.propose.outputs.PROPOSED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="conflict-${{ steps.propose.outputs.CANDIDATE_ID }}"

          # Already asked once: do not reopen the same question every hour.
          if gh pr list --state all --head "$BRANCH" --json number --jq '.[0].number' | grep -q .; then
            echo "Already proposed on $BRANCH."
            exit 0
          fi

          # The label has to exist before it can be applied. Without this the very first
          # proposal died at `gh pr create`, after the branch had already been pushed — and
          # every hourly run then failed trying to push a branch that was already there,
          # reporting a broken ingest when the ingest itself was fine.
          gh label create conflict-review \
            --description "A possible new conflict, awaiting a human decision" \
            --color FFB000 2>/dev/null || true

          git config user.name "igred-bot"
          git config user.email "map@igred.org"

          # Recover from exactly that state: a branch left behind with no pull request on it.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists with no pull request; opening one for it."
          else
            git checkout -b "$BRANCH"
            git add config/verified-conflicts.json
            git commit -m "propose: ${{ steps.propose.outputs.COUNTRY }} for review"
            git push origin "$BRANCH"
          fi

          gh pr create \
            --title "Possible new conflict: ${{ steps.propose.outputs.COUNTRY }}" \
            --body-file /tmp/conflict-pr.md \
            --label conflict-review \
            --head "$BRANCH"

      # Runs after the commit so good data is never lost to an alert.
      - name: Check source health
        id: health
        continue-on-error: true
        run: npm run health-check

      - name: Open or update an alert issue
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$(npm run --silent health-check 2>&1 || true)"
          EXISTING="$(gh issue list --state open --label pipeline-alert --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Pipeline alert: a source has been down too long" \
              --label pipeline-alert --body "$BODY"
          fi

      - name: Close the alert issue once healthy again
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING="$(gh issue list --state open --label pipeline-alert --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Sources are healthy again."
          fi
