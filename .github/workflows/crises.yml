name: Crises

# Runs after each ingest: rebuilds the crisis pages and the map's compact incident file
# from what the ingest just published, plus GDELT's article index, Google News, Wikipedia
# and the World Bank, and refreshes the machine-written summaries at most every three hours. Like the ingest it writes only to data/, so it never triggers a deploy.
on:
  workflow_run:
    workflows: [Ingest]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  # To start the map's deploy when a feed has changed: a push by this workflow's own token
  # does not start other workflows, a dispatch does.
  actions: write

# Shares the ingest's group, so the two never push to data/ at the same moment.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  crises:
    runs-on: ubuntu-latest
    # Two model calls per crisis, paced for the free tier, on top of the news fetches.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The summaries use whichever free-tier key is set; none set means the pages show the
      # status line alone. A provider error or a rejected draft never fails this step.
      - name: Build crisis pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npm run crises

      - name: Commit data if it changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain data site/feed)" ]; then
            echo "No data changes."
            exit 0
          fi
          # Feeds live with the map; if one changed, the map is deployed once after the push.
          if [ -n "$(git status --porcelain site/feed)" ]; then echo "feeds=changed" >> "$GITHUB_OUTPUT"; fi
          git config user.name "igred-bot"
          git config user.email "map@igred.org"
          git add data site/feed
          git commit -m "data: crises $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Publish the feeds with the map
        if: steps.commit.outputs.feeds == 'changed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # At most once an hour: if the map was deployed in the last hour, the feeds wait for the
        # next run, which deploys whatever is committed by then.
        run: |
          last=$(gh run list --workflow pages.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 3600 ]; then
            echo "the map was deployed less than an hour ago; the feeds go out with the next run"
            exit 0
          fi
          gh workflow run pages.yml --ref main
