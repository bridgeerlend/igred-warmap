name: Deploy map

# The path filter is the point, not a detail. The ingest workflow commits to data/ every
# hour; if those commits rebuilt the site, the project would burn build minutes around the
# clock and the "built once" guarantee would be gone. The page fetches its data at view
# time instead, so only a change to the page itself needs a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the data source is still a placeholder
        run: |
          # Match the value, not the fallback logic that also names the sentinel — the
          # loose grep would have failed this deploy even after the slug was filled in.
          if grep -qE "repoSlug: *'REPLACE_WITH" site/config.js; then
            echo "site/config.js still has the placeholder repoSlug."
            echo "The published map would fall back to a relative data path and show nothing."
            echo "Set CONFIG.repoSlug to the public repository, e.g. yourname/igred-warmap."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
